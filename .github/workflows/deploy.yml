  FRONTEND_PUBLISH_PROFILE: |
    <publishData><publishProfile profileName="app-taskapp-frontend-ghazia - Web Deploy" publishMethod="MSDeploy" publishUrl="app-taskapp-frontend-ghazia.scm.azurewebsites.net:443" msdeploySite="app-taskapp-frontend-ghazia" userName="$app-taskapp-frontend-ghazia" userPWD="xNFA0FgaYPiojaraQGkWaySN9yuYu0k01LLigCo2rqwkpKjf09tGitMCk18t" destinationAppUrl="http://app-taskapp-frontend-ghazia.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="app-taskapp-frontend-ghazia - FTP" publishMethod="FTP" publishUrl="ftp://waws-prod-sg1-101.ftp.azurewebsites.windows.net/site/wwwroot" ftpPassiveMode="True" userName="app-taskapp-frontend-ghazia\$app-taskapp-frontend-ghazia" userPWD="xNFA0FgaYPiojaraQGkWaySN9yuYu0k01LLigCo2rqwkpKjf09tGitMCk18t" destinationAppUrl="http://app-taskapp-frontend-ghazia.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="app-taskapp-frontend-ghazia - Zip Deploy" publishMethod="ZipDeploy" publishUrl="app-taskapp-frontend-ghazia.scm.azurewebsites.net:443" userName="$app-taskapp-frontend-ghazia" userPWD="xNFA0FgaYPiojaraQGkWaySN9yuYu0k01LLigCo2rqwkpKjf09tGitMCk18t" destinationAppUrl="http://app-taskapp-frontend-ghazia.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile></publishData>

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/taskapp-backend:latest ./backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/taskapp-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build --build-arg REACT_APP_API_URL=https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net -t ${{ env.ACR_LOGIN_SERVER }}/taskapp-frontend:latest ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/taskapp-frontend:latest

      - name: Deploy Backend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.BACKEND_APP_NAME }}
          publish-profile: ${{ env.BACKEND_PUBLISH_PROFILE }}
          images: ${{ env.ACR_LOGIN_SERVER }}/taskapp-backend:latest

      - name: Deploy Frontend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.FRONTEND_APP_NAME }}
          publish-profile: ${{ env.FRONTEND_PUBLISH_PROFILE }}
          images: ${{ env.ACR_LOGIN_SERVER }}/taskapp-frontend:latest
