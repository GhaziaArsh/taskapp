# ══════════════════════════════════════════════════════════════
# Frontend CI/CD Pipeline
# Triggers on changes to the frontend/ folder on main or develop
# ══════════════════════════════════════════════════════════════
trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - frontend/**

variables:
  - group: taskapp-variables
  - name: imageTag
    value: $(Build.BuildId)

stages:
  # ── Stage 1: Build & Push Docker Image ──────────────────
  - stage: Build
    displayName: 'Build and Push Frontend Image'
    jobs:
      - job: BuildJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: acr-service-connection

          - task: Docker@2
            displayName: 'Build Frontend Image'
            inputs:
              command: build
              repository: $(FRONTEND_IMAGE_NAME)
              dockerfile: frontend/Dockerfile
              buildContext: frontend/
              arguments: '--build-arg REACT_APP_API_URL=$(BACKEND_API_URL)'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Push Frontend Image to ACR'
            inputs:
              command: push
              repository: $(FRONTEND_IMAGE_NAME)
              containerRegistry: acr-service-connection
              tags: |
                $(imageTag)
                latest

  # ── Stage 2: Deploy to Dev ──────────────────────────────
  - stage: DeployDev
    displayName: 'Deploy Frontend to Development'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployDevJob
        environment: 'development'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureStaticWebApp@0
                  displayName: 'Deploy to Static Web App (Dev)'
                  inputs:
                    app_location: 'frontend'
                    output_location: 'build'
                    azure_static_web_apps_api_token: $(STATIC_WEBAPP_TOKEN_DEV)

  # ── Stage 3: Deploy to Prod ─────────────────────────────
  - stage: DeployProd
    displayName: 'Deploy Frontend to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProdJob
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureStaticWebApp@0
                  displayName: 'Deploy to Static Web App (Prod)'
                  inputs:
                    app_location: 'frontend'
                    output_location: 'build'
                    azure_static_web_apps_api_token: $(STATIC_WEBAPP_TOKEN_PROD)
